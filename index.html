<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remawed10 Commit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            /* Sfondo con immagine 1.jpg e overlay scuro per leggibilità */
            background: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.85)), url('1.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #ffffff;
        }
        .form-group {
            margin-bottom: 15px;
        }
        select, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background-color: rgba(30, 30, 30, 0.9);
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0116ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #3700b3;
        }
        #comments-list {
            margin-top: 30px;
        }
        .comment-card {
            background-color: rgba(30, 30, 30, 0.9);
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 4px solid #6200ee;
        }
        .comment-category {
            font-weight: bold;
            color: #bb86fc;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .comment-text {
            font-size: 14px;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Remawed10 Commit</h2>
    
    <!-- Modulo per inviare il commento -->
    <form id="comment-form">
        <div class="form-group">
            <select id="category" required>
                <option value="" disabled selected>Seleziona il motivo...</option>
                <option value="Desiderio">Desiderio</option>
                <option value="Problemi o bug">Problemi o bug</option>
                <option value="Consigli">Consigli</option>
            </select>
        </div>
        <div class="form-group">
            <textarea id="message" placeholder="Scrivi il tuo commento..." required></textarea>
        </div>
        <button type="submit">Invia Commento</button>
    </form>

    <!-- Sezione in cui compariranno i commenti -->
    <div id="comments-list">
        <h3>Commenti recenti:</h3>
        
        <!-- Filtro per categoria -->
        <div class="form-group">
            <select id="filter-category">
                <option value="">Tutti i motivi (Mostra tutto)</option>
                <option value="Desiderio">Desiderio</option>
                <option value="Problemi o bug">Problemi o bug</option>
                <option value="Consigli">Consigli</option>
            </select>
        </div>

        <div id="comments-container">Caricamento commenti...</div>
    </div>
</div>

<script>
    // URL del server Flask attivo sul tablet in locale
    const API_URL = "SCRIVI LA TUA API";

    // Variabile per conservare tutti i commenti scaricati
    let allComments = [];

    // Funzione per caricare i commenti dal server
    async function fetchComments() {
        try {
            const response = await fetch(API_URL + "/comments");
            allComments = await response.json();
            renderComments();
        } catch (error) {
            console.error("Errore nel caricamento dei commenti:", error);
            document.getElementById("comments-container").innerHTML = "<p style='color: #ff5555;'>il server e spento, per sapere quando e acceso vai nel server whatsapp! alla pagina ufficiale Remawed10 info!.</p>";
        }
    }

    // Funzione per mostrare i commenti filtrati in base alla tendina
    function renderComments() {
        const container = document.getElementById("comments-container");
        const selectedFilter = document.getElementById("filter-category").value;
        container.innerHTML = "";

        // Filtra i commenti se è stata scelta una categoria
        let filteredComments = allComments;
        if (selectedFilter) {
            filteredComments = allComments.filter(c => c.category === selectedFilter);
        }

        if (filteredComments.length === 0) {
            container.innerHTML = "<p>Nessun commento trovato per questo motivo.</p>";
            return;
        }

        // Crea le card dei commenti filtrati
        [...filteredComments].reverse().forEach(c => {
            const card = document.createElement("div");
            card.className = "comment-card";
            card.innerHTML = `
                <div class="comment-category">${escapeHtml(c.category)}</div>
                <div class="comment-text">${escapeHtml(c.message)}</div>
            `;
            container.appendChild(card);
        });
    }

    // Ascolta il cambiamento del filtro per aggiornare la visualizzazione all'istante
    document.getElementById("filter-category").addEventListener("change", renderComments);

    // Gestione dell'invio del modulo
    document.getElementById("comment-form").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const category = document.getElementById("category").value;
        const message = document.getElementById("message").value;

        try {
            const response = await fetch(API_URL + "/comments", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ author: "client", category, message })
            });

            if (response.ok) {
                document.getElementById("message").value = ""; // Pulisce la textarea
                document.getElementById("category").selectedIndex = 0; // Resetta la tendina
                fetchComments(); // Ricarica la lista aggiornata
            } else if (response.status === 429) {
                alert("Hai raggiunto il limite massimo di 5 commenti giornalieri.");
            } else {
                alert("Errore durante l'invio del commento.");
            }
        } catch (error) {
            console.error("Errore di rete:", error);
            alert("il server e spento.");
        }
    });

    // Funzione di sicurezza per evitare script malevoli nei commenti
    function escapeHtml(text) {
        if (!text) return "";
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Carica i commenti all'avvio della pagina
    fetchComments();
    
    // Aggiorna automaticamente i commenti ogni 10 secondi
    setInterval(fetchComments, 10000);
</script>

</body>
</html>
